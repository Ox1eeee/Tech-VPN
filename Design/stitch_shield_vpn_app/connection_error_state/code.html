<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>SENTRY VPN - Connection Error</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --primary-red: #E2231A;
            --surface-black: #0A0A0A;
            --surface-card: #161616;
        }
        body {
            background-color: var(--surface-black);
            color: #e3e2e2;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .glow-pulse {
            animation: pulse-glow 3s infinite ease-in-out;
        }
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.15; filter: blur(20px); }
            50% { opacity: 0.3; filter: blur(25px); }
        }
        .error-shield-container {
            position: relative;
            display: flex;
            align-items: center;
            justify-center;
        }
        .vignette {
            background: radial-gradient(circle at center, transparent 0%, rgba(10,10,10,0.8) 100%);
            pointer-events: none;
        }
    </style>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary-container": "#fffaff",
                    "tertiary-container": "#757474",
                    "secondary-fixed": "#e5e2e1",
                    "on-background": "#e3e2e2",
                    "surface-tint": "#ffb4a9",
                    "on-primary": "#690001",
                    "error-container": "#93000a",
                    "surface-container-low": "#1b1c1c",
                    "surface-container-lowest": "#0d0e0f",
                    "on-primary-fixed": "#410000",
                    "on-tertiary-fixed-variant": "#474746",
                    "error": "#ffb4ab",
                    "on-surface-variant": "#e7bdb7",
                    "on-surface": "#e3e2e2",
                    "on-secondary-container": "#b7b4b4",
                    "on-secondary-fixed": "#1c1b1b",
                    "primary": "#ffb4a9",
                    "primary-fixed-dim": "#ffb4a9",
                    "surface-container-highest": "#343535",
                    "secondary-fixed-dim": "#c8c6c5",
                    "on-tertiary-container": "#fffbfb",
                    "on-error-container": "#ffdad6",
                    "outline": "#ae8882",
                    "outline-variant": "#5d3f3b",
                    "surface": "#121414",
                    "surface-bright": "#383939",
                    "surface-dim": "#121414",
                    "surface-container-high": "#292a2a",
                    "background": "#121414",
                    "inverse-surface": "#e3e2e2",
                    "on-tertiary-fixed": "#1b1c1c",
                    "tertiary-fixed-dim": "#c8c6c5",
                    "inverse-on-surface": "#303031",
                    "on-tertiary": "#303030",
                    "inverse-primary": "#c00005",
                    "primary-container": "#e2231a",
                    "surface-container": "#1f2020",
                    "surface-variant": "#343535",
                    "secondary": "#c8c6c5",
                    "tertiary-fixed": "#e5e2e1",
                    "primary-fixed": "#ffdad5",
                    "tertiary": "#c8c6c5",
                    "secondary-container": "#474746",
                    "on-primary-fixed-variant": "#930003",
                    "on-secondary": "#313030",
                    "on-error": "#690005"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "xs": "8px",
                    "gutter": "16px",
                    "xl": "48px",
                    "base": "4px",
                    "lg": "32px",
                    "safe-margin": "20px",
                    "sm": "16px"
            },
            "fontFamily": {
                    "body-sm": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "headline-xl": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "label-caps": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "data-mono": ["JetBrains Mono"]
            },
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "data-mono": ["16px", {"lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">
<!-- Subtle Background Shader/Atmosphere -->
<div class="fixed inset-0 z-0">

<div class="absolute inset-0 vignette"></div>
</div>
<!-- TopAppBar Navigation Shell -->
<header class="relative z-50 flex justify-between items-center w-full px-safe-margin h-16 bg-surface dark:bg-surface">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary" data-icon="shield">shield</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold tracking-tighter text-primary">SENTRY VPN</span>
</div>
<div class="hover:opacity-80 transition-opacity cursor-pointer">
<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center overflow-hidden border border-outline-variant/30">
<span class="material-symbols-outlined text-sm" data-icon="person">person</span>
</div>
</div>
</header>
<!-- Main Content Area: Centered Error State -->
<main class="relative z-10 flex-grow flex flex-col items-center justify-center px-safe-margin text-center">
<!-- Error Visual -->
<div class="relative mb-lg">
<!-- Glow Effect behind the shield -->
<div class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-primary-container rounded-full blur-[40px] opacity-20 glow-pulse"></div>
<!-- Outlined Shield Icon -->
<div class="relative flex flex-col items-center justify-center">
<div class="w-32 h-32 border-2 border-primary-container rounded-3xl flex items-center justify-center transform rotate-45 shadow-[inset_0_0_20px_rgba(226,35,26,0.2)]">
<span class="material-symbols-outlined text-6xl text-primary-container -rotate-45" data-icon="warning" style="font-variation-settings: 'FILL' 0, 'wght' 300;">warning</span>
</div>
</div>
</div>
<!-- Typography Cluster -->
<div class="max-w-xs space-y-sm mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Connection Failed</h1>
<p class="font-body-md text-body-md text-secondary leading-relaxed">
                Server unreachable. Please check your internet or try another location.
            </p>
</div>
<!-- Action Cluster -->
<div class="flex flex-col items-center gap-md w-full max-w-[280px]">
<button class="group relative w-full h-14 bg-primary-container hover:opacity-90 active:scale-95 transition-all duration-150 rounded-full flex items-center justify-center font-label-caps text-label-caps text-on-primary-container shadow-[0_0_20px_rgba(226,35,26,0.4)]" onclick="simulateRetry(this)">
<span class="btn-text">RETRY</span>
<!-- Loading State (Hidden by default) -->
<div class="hidden absolute inset-0 items-center justify-center gap-2" id="retry-loader">
<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>
<span>CONNECTING...</span>
</div>
</button>
<a class="font-label-caps text-label-caps text-secondary hover:text-primary transition-colors flex items-center gap-2 group" href="#">
<span class="material-symbols-outlined text-sm group-hover:translate-x-[-2px] transition-transform" data-icon="public">public</span>
                CHOOSE DIFFERENT SERVER
            </a>
</div>
</main>
<!-- Stat Monitoring (Monospaced Data) -->
<div class="relative z-10 px-safe-margin pb-32 flex flex-col items-center">
<div class="flex gap-lg bg-surface-container-low/50 backdrop-blur-md px-md py-xs rounded-xl border border-white/5">
<div class="flex flex-col">
<span class="font-label-caps text-[10px] text-on-secondary-container opacity-60">PING</span>
<span class="font-data-mono text-data-mono text-error">--- ms</span>
</div>
<div class="flex flex-col border-l border-white/10 pl-lg">
<span class="font-label-caps text-[10px] text-on-secondary-container opacity-60">STATUS</span>
<span class="font-data-mono text-data-mono text-error uppercase">Disconnected</span>
</div>
</div>
</div>
<!-- BottomNavBar Navigation Shell -->
<!-- Determined active item as 'home' because this is the primary connection dashboard screen -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center h-20 pb-safe px-md bg-surface-container-lowest dark:bg-surface-container-lowest border-t border-outline-variant/10">
<button class="flex items-center justify-center text-primary dark:text-primary drop-shadow-[0_0_8px_rgba(226,35,26,0.4)] scale-110">
<span class="material-symbols-outlined" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
</button>
<button class="flex items-center justify-center text-secondary dark:text-secondary hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" data-icon="dns">dns</span>
</button>
<button class="flex items-center justify-center text-secondary dark:text-secondary hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" data-icon="equalizer">equalizer</span>
</button>
<button class="flex items-center justify-center text-secondary dark:text-secondary hover:text-primary-fixed-dim transition-colors">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</nav>
<script>
        function simulateRetry(btn) {
            const btnText = btn.querySelector('.btn-text');
            const loader = btn.querySelector('#retry-loader');
            
            btnText.classList.add('hidden');
            loader.classList.remove('hidden');
            loader.classList.add('flex');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'pointer-events-none');
            
            // Mock retry logic
            setTimeout(() => {
                btnText.classList.remove('hidden');
                loader.classList.add('hidden');
                loader.classList.remove('flex');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'pointer-events-none');
                
                // Add a little feedback shake or flash
                btn.classList.add('animate-pulse');
                setTimeout(() => btn.classList.remove('animate-pulse'), 1000);
            }, 2500);
        }
    </script>
</body></html>
