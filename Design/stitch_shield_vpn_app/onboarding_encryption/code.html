<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Sentry VPN - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --primary-red: #E2231A;
            --background-black: #0A0A0A;
            --surface-gray: #161616;
        }
        body {
            background-color: var(--background-black);
            color: #E3E2E2;
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }
        .glow-effect {
            box-shadow: 0 0 20px rgba(226, 35, 26, 0.15);
        }
        .shield-container {
            position: relative;
            animation: pulse-glow 4s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px rgba(226, 35, 26, 0.2)); }
            50% { transform: scale(1.02); filter: drop-shadow(0 0 15px rgba(226, 35, 26, 0.4)); }
        }
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, #E2231A, transparent);
            position: absolute;
            top: 0;
            animation: scan 3s linear infinite;
            opacity: 0.3;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed-variant": "#474746",
                        "on-primary-container": "#fffaff",
                        "tertiary-container": "#757474",
                        "secondary-fixed": "#e5e2e1",
                        "on-background": "#e3e2e2",
                        "surface-tint": "#ffb4a9",
                        "on-primary": "#690001",
                        "error-container": "#93000a",
                        "surface-container-low": "#1b1c1c",
                        "surface-container-lowest": "#0d0e0f",
                        "on-primary-fixed": "#410000",
                        "on-tertiary-fixed-variant": "#474746",
                        "error": "#ffb4ab",
                        "on-surface-variant": "#e7bdb7",
                        "on-surface": "#e3e2e2",
                        "on-secondary-container": "#b7b4b4",
                        "on-secondary-fixed": "#1c1b1b",
                        "primary": "#ffb4a9",
                        "primary-container": "#e2231a",
                        "surface-container": "#1f2020",
                        "surface-variant": "#343535",
                        "secondary": "#c8c6c5",
                        "tertiary-fixed": "#e5e2e1",
                        "primary-fixed": "#ffdad5",
                        "tertiary": "#c8c6c5",
                        "secondary-container": "#474746",
                        "on-primary-fixed-variant": "#930003",
                        "on-secondary": "#313030",
                        "on-error": "#690005",
                        "surface": "#121414"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "24px",
                        "xs": "8px",
                        "gutter": "16px",
                        "xl": "48px",
                        "base": "4px",
                        "lg": "32px",
                        "safe-margin": "20px",
                        "sm": "16px"
                    },
                    "fontFamily": {
                        "body-sm": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-xl": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "data-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                        "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "data-mono": ["16px", {"lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col h-screen w-full max-w-md mx-auto relative px-safe-margin pb-safe pt-safe overflow-hidden bg-surface-container-lowest">
<!-- Top Utility Bar (Skip Action) -->
<header class="flex justify-between items-center h-16 w-full z-20">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary-container" style="font-variation-settings: 'FILL' 1;">shield</span>
<span class="font-label-caps text-label-caps text-on-surface tracking-widest">SENTRY</span>
</div>
<button class="font-label-caps text-label-caps text-secondary uppercase tracking-widest hover:text-on-surface transition-colors">
            Skip
        </button>
</header>
<!-- Main Content: First Slide -->
<main class="flex-1 flex flex-col items-center justify-center text-center space-y-lg z-10">
<!-- Illustration Area -->
<div class="relative w-64 h-64 flex items-center justify-center shield-container">
<!-- Background Atmospheric Effect -->
<div class="absolute inset-0 bg-primary-container/5 rounded-full blur-3xl"></div>
<!-- Red Line Art Shield Illustration -->
<div class="relative w-48 h-48 border-2 border-primary-container rounded-3xl flex items-center justify-center transform rotate-45 overflow-hidden">
<div class="scanline"></div>
<div class="transform -rotate-45 flex flex-col items-center">
<span class="material-symbols-outlined text-[80px] text-primary-container" style="font-variation-settings: 'wght' 200;">shield</span>
<div class="absolute inset-0 flex items-center justify-center mt-2">
<span class="material-symbols-outlined text-[32px] text-primary-container" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
</div>
</div>
</div>
<!-- Typography Cluster -->
<article class="space-y-sm max-w-[280px]">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background tracking-tight">
                Military-grade encryption
            </h1>
<p class="font-body-md text-body-md text-secondary leading-relaxed opacity-80">
                Your data is protected by the highest standards.
            </p>
</article>
</main>
<!-- Footer Controls -->
<footer class="w-full space-y-lg pb-10 z-20">
<!-- Page Indicator Dots -->
<div class="flex justify-center items-center gap-2">
<div class="w-2.5 h-2.5 rounded-full bg-primary-container shadow-[0_0_8px_rgba(226,35,26,0.5)]"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Primary Action Button -->
<div class="px-gutter">
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-4 rounded-full flex items-center justify-center gap-2 uppercase tracking-[0.1em] hover:opacity-90 active:scale-95 transition-all shadow-[0_4px_24px_rgba(226,35,26,0.3)]">
                Get Started
                <span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</div>
</footer>
<!-- Background Decorative Elements -->
<div class="absolute top-[-10%] right-[-10%] w-64 h-64 bg-primary-container/10 blur-[100px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-10%] w-80 h-80 bg-primary-container/5 blur-[120px] rounded-full"></div>
<script>
        // Simple Interaction Script
        document.querySelector('button').addEventListener('click', function() {
            // Placeholder for next slide navigation
            console.log('Navigating to next onboarding step...');
        });

        // Add subtle mouse move effect for depth
        document.addEventListener('mousemove', (e) => {
            const shield = document.querySelector('.shield-container');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 40;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 40;
            shield.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body></html>
