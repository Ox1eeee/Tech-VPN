<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>SENTRY VPN - Secure Access</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary-fixed-variant": "#474746",
                    "on-primary-container": "#fffaff",
                    "tertiary-container": "#757474",
                    "secondary-fixed": "#e5e2e1",
                    "on-background": "#e3e2e2",
                    "surface-tint": "#ffb4a9",
                    "on-primary": "#690001",
                    "error-container": "#93000a",
                    "surface-container-low": "#1b1c1c",
                    "surface-container-lowest": "#0d0e0f",
                    "on-primary-fixed": "#410000",
                    "on-tertiary-fixed-variant": "#474746",
                    "error": "#ffb4ab",
                    "on-surface-variant": "#e7bdb7",
                    "on-surface": "#e3e2e2",
                    "on-secondary-container": "#b7b4b4",
                    "on-secondary-fixed": "#1c1b1b",
                    "primary": "#ffb4a9",
                    "primary-fixed-dim": "#ffb4a9",
                    "surface-container-highest": "#343535",
                    "secondary-fixed-dim": "#c8c6c5",
                    "on-tertiary-container": "#fffbfb",
                    "on-error-container": "#ffdad6",
                    "outline": "#ae8882",
                    "outline-variant": "#5d3f3b",
                    "surface": "#121414",
                    "surface-bright": "#383939",
                    "surface-dim": "#121414",
                    "surface-container-high": "#292a2a",
                    "background": "#0A0A0A",
                    "inverse-surface": "#e3e2e2",
                    "on-tertiary-fixed": "#1b1c1c",
                    "tertiary-fixed-dim": "#c8c6c5",
                    "inverse-on-surface": "#303031",
                    "on-tertiary": "#303030",
                    "inverse-primary": "#c00005",
                    "primary-container": "#e2231a",
                    "surface-container": "#1f2020",
                    "surface-variant": "#343535",
                    "secondary": "#c8c6c5",
                    "tertiary-fixed": "#e5e2e1",
                    "primary-fixed": "#ffdad5",
                    "tertiary": "#c8c6c5",
                    "secondary-container": "#474746",
                    "on-primary-fixed-variant": "#930003",
                    "on-secondary": "#313030",
                    "on-error": "#690005"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "md": "24px",
                    "xs": "8px",
                    "gutter": "16px",
                    "xl": "48px",
                    "base": "4px",
                    "lg": "32px",
                    "safe-margin": "20px",
                    "sm": "16px"
            },
            "fontFamily": {
                    "body-sm": ["Hanken Grotesk"],
                    "headline-lg-mobile": ["Hanken Grotesk"],
                    "headline-xl": ["Hanken Grotesk"],
                    "body-md": ["Hanken Grotesk"],
                    "label-caps": ["Hanken Grotesk"],
                    "headline-lg": ["Hanken Grotesk"],
                    "data-mono": ["JetBrains Mono"]
            },
            "fontSize": {
                    "body-sm": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                    "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                    "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-lg": ["28px", {"lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "data-mono": ["16px", {"lineHeight": "24px", "letterSpacing": "0.02em", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #0A0A0A;
            color: #e3e2e2;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .login-card {
            background: #0A0A0A;
        }
        .tab-active {
            color: #e3e2e2;
            border-bottom: 2px solid #e2231a;
        }
        .tab-inactive {
            color: #8A8A8A;
        }
        /* Custom Focus Ring for Inputs */
        .input-focus-glow:focus {
            outline: none;
            border-color: #e2231a;
            box-shadow: inset 0 0 8px rgba(226, 35, 26, 0.2);
        }
        .btn-active:active {
            transform: scale(0.98);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen px-safe-margin font-body-md overflow-hidden">
<!-- Atmospheric WebGL Shader Background -->

<div class="relative z-10 w-full max-w-md flex flex-col items-center">
<!-- Logo Section (Shared Component logic: Small Shield) -->
<header class="mb-lg flex flex-col items-center animate-fade-in">
<div class="mb-sm text-primary-container">
<span class="material-symbols-outlined text-[48px]" data-icon="shield">shield</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile tracking-tighter text-on-background">SENTRY VPN</h1>
</header>
<!-- Main Auth Container -->
<main class="w-full space-y-md">
<!-- Tab Toggle -->
<div class="flex border-b border-white/5 w-full">
<button class="flex-1 py-sm font-label-caps text-label-caps tab-active transition-colors duration-200 uppercase tracking-widest" id="loginTab" onclick="switchTab('login')">
                    Log In
                </button>
<button class="flex-1 py-sm font-label-caps text-label-caps tab-inactive transition-colors duration-200 uppercase tracking-widest" id="signupTab" onclick="switchTab('signup')">
                    Sign Up
                </button>
</div>
<!-- Form Fields -->
<form class="space-y-sm pt-xs" id="authForm" onsubmit="event.preventDefault()">
<div class="space-y-xs">
<label class="font-label-caps text-[10px] text-secondary uppercase tracking-widest ml-1">Email Address</label>
<input class="w-full bg-[#161616] border border-[#333333] rounded-lg py-sm px-md text-on-surface font-body-md placeholder-secondary-fixed-dim/30 input-focus-glow transition-all duration-200" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-xs relative">
<label class="font-label-caps text-[10px] text-secondary uppercase tracking-widest ml-1">Password</label>
<input class="w-full bg-[#161616] border border-[#333333] rounded-lg py-sm px-md text-on-surface font-body-md placeholder-secondary-fixed-dim/30 input-focus-glow transition-all duration-200" placeholder="••••••••" type="password"/>
<button class="absolute right-md bottom-[14px] text-secondary hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Primary Action Button -->
<div class="pt-sm">
<button class="w-full bg-primary-container text-on-primary-container font-label-caps text-label-caps py-md rounded-full btn-active transition-all duration-300 hover:shadow-[0_0_20px_rgba(226,35,26,0.3)] shadow-lg uppercase tracking-widest">
                        Log In
                    </button>
</div>
</form>
<!-- Forgot Password -->
<div class="text-center">
<a class="font-body-sm text-body-sm text-secondary hover:text-primary transition-colors duration-200" href="#">
                    Forgot Password?
                </a>
</div>
<!-- Divider -->
<div class="flex items-center space-x-sm py-sm">
<div class="h-[1px] flex-1 bg-white/5"></div>
<span class="font-label-caps text-[10px] text-secondary uppercase">OR</span>
<div class="h-[1px] flex-1 bg-white/5"></div>
</div>
<!-- Social Auth -->
<div class="space-y-sm">
<button class="w-full border border-secondary/20 bg-transparent text-on-surface font-label-caps text-label-caps py-md rounded-full btn-active transition-all duration-200 hover:bg-white/5 flex items-center justify-center space-x-sm uppercase tracking-widest">
<span class="material-symbols-outlined text-[20px]" data-icon="apple">apps</span>
<span>Continue with Apple</span>
</button>
</div>
</main>
<!-- Footer Footer (Microcopy) -->
<footer class="mt-xl text-center">
<p class="font-body-sm text-body-sm text-secondary/40 max-w-xs leading-relaxed">
                By continuing, you agree to Sentry's Professional Security Terms and Privacy Mandate.
            </p>
</footer>
</div>
<!-- Background Subtle Glow Effect (Atmospheric) -->
<div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-primary-container/5 blur-[120px] rounded-full pointer-events-none"></div>
<script>
        function switchTab(type) {
            const loginTab = document.getElementById('loginTab');
            const signupTab = document.getElementById('signupTab');
            const submitBtn = document.querySelector('form button');

            if (type === 'login') {
                loginTab.classList.remove('tab-inactive');
                loginTab.classList.add('tab-active');
                signupTab.classList.remove('tab-active');
                signupTab.classList.add('tab-inactive');
                submitBtn.innerText = 'Log In';
            } else {
                signupTab.classList.remove('tab-inactive');
                signupTab.classList.add('tab-active');
                loginTab.classList.remove('tab-active');
                loginTab.classList.add('tab-inactive');
                submitBtn.innerText = 'Sign Up';
            }
            
            // Add a subtle click feedback animation
            submitBtn.classList.add('scale-95');
            setTimeout(() => submitBtn.classList.remove('scale-95'), 100);
        }

        // Lightweight entrance animation
        document.addEventListener('DOMContentLoaded', () => {
            const main = document.querySelector('main');
            main.style.opacity = '0';
            main.style.transform = 'translateY(10px)';
            
            setTimeout(() => {
                main.style.transition = 'all 0.6s cubic-bezier(0.16, 1, 0.3, 1)';
                main.style.opacity = '1';
                main.style.transform = 'translateY(0)';
            }, 100);
        });
    </script>
</body></html>
