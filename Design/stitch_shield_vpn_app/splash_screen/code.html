<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SENTRY VPN | Secure. Private. Fast.</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;700;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        /* Base styles from typography tokens */
        body {
            font-family: 'Hanken+Grotesk', sans-serif;
            background-color: #0A0A0A;
            margin: 0;
            overflow: hidden;
            color: #e3e2e2;
        }

        /* Pulse effect for the logo */
        @keyframes pulse-glow {
            0% {
                filter: drop-shadow(0 0 15px rgba(226, 35, 26, 0.4));
                transform: scale(1);
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(226, 35, 26, 0.7));
                transform: scale(1.02);
            }
            100% {
                filter: drop-shadow(0 0 15px rgba(226, 35, 26, 0.4));
                transform: scale(1);
            }
        }

        .logo-pulse {
            animation: pulse-glow 3s ease-in-out infinite;
        }

        /* Scanline effect for cyber-technic feel */
        .scanline {
            width: 100%;
            height: 2px;
            background: linear-gradient(to right, transparent, rgba(226, 35, 26, 0.2), transparent);
            position: absolute;
            top: -2px;
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% { top: -10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 110%; opacity: 0; }
        }

        /* Vignette for infinite depth */
        .vignette {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, transparent 20%, rgba(0,0,0,0.8) 100%);
            pointer-events: none;
            z-index: 10;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#ffb4a9",
                        "primary-container": "#e2231a",
                        "on-primary": "#690001",
                        "surface": "#121414",
                        "surface-container-lowest": "#0d0e0f",
                        "background": "#0A0A0A", /* Custom Override for Splash */
                        "on-background": "#e3e2e2",
                        "outline": "#ae8882",
                    },
                    "fontFamily": {
                        "body-sm": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "headline-xl": ["Hanken Grotesk"],
                        "label-caps": ["Hanken Grotesk"],
                        "data-mono": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["24px", {"lineHeight": "30px", "fontWeight": "700"}],
                        "headline-xl": ["40px", {"lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.15em", "fontWeight": "700"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background flex items-center justify-center min-h-screen">
<!-- Ambient Background Element -->
<div class="fixed inset-0 overflow-hidden">

<div class="scanline"></div>
<div class="vignette"></div>
</div>
<!-- Main Splash Content -->
<main class="relative z-20 flex flex-col items-center">
<!-- Logo Container -->
<div class="logo-pulse mb-8 relative">
<!-- Shield Logo (Simulated SVG for specific S-Shield branding) -->
<div class="w-32 h-32 flex items-center justify-center border-4 border-primary-container rounded-3xl rotate-45">
<div class="-rotate-45">
<span class="material-symbols-outlined text-primary-container text-[80px] font-thin" style="font-variation-settings: 'FILL' 0, 'wght' 200;">
                        shield
                    </span>
<!-- The "S" identity inside the shield -->
<div class="absolute inset-0 flex items-center justify-center">
<span class="font-headline-xl text-primary-container tracking-tighter" style="font-size: 32px; transform: translateY(2px);">S</span>
</div>
</div>
</div>
<!-- Secondary glow layer -->
<div class="absolute -inset-4 bg-primary-container/10 blur-3xl rounded-full -z-10"></div>
</div>
<!-- Identity -->
<div class="text-center">
<h1 class="font-headline-xl text-[#F2F2F2] mb-2 tracking-widest uppercase">
                SENTRY VPN
            </h1>
<div class="flex items-center justify-center space-x-2">
<span class="w-8 h-[1px] bg-primary-container/30"></span>
<p class="font-label-caps text-primary-container uppercase tracking-[0.3em]">
                    Secure. Private. Fast.
                </p>
<span class="w-8 h-[1px] bg-primary-container/30"></span>
</div>
</div>
<!-- Status / Progress Mockup (Subtle) -->
<div class="mt-24 flex flex-col items-center">
<div class="w-48 h-[2px] bg-[#161616] rounded-full overflow-hidden relative">
<div class="absolute left-0 top-0 h-full bg-primary-container shadow-[0_0_8px_rgba(226,35,26,0.8)] transition-all duration-700 ease-out" id="loading-bar" style="width: 0%"></div>
</div>
<p class="font-data-mono text-[10px] text-outline mt-4 uppercase tracking-widest opacity-50" id="status-text">
                INITIALIZING_ENCRYPTION_LAYERS...
            </p>
</div>
</main>
<!-- Micro-interactions Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const bar = document.getElementById('loading-bar');
            const status = document.getElementById('status-text');
            const states = [
                "ESTABLISHING_SECURE_TUNNEL...",
                "OPTIMIZING_GLOBAL_NODES...",
                "VERIFYING_PROTOCOL_INTEGRITY...",
                "READY_FOR_CONNECTION"
            ];
            
            let progress = 0;
            let stateIdx = 0;

            const interval = setInterval(() => {
                progress += Math.random() * 15;
                if (progress > 100) {
                    progress = 100;
                    clearInterval(interval);
                }
                bar.style.width = `${progress}%`;

                // Rotate text based on progress thresholds
                if (progress > 25 && stateIdx === 0) stateIdx = 1;
                if (progress > 55 && stateIdx === 1) stateIdx = 2;
                if (progress > 85 && stateIdx === 2) stateIdx = 3;
                
                status.innerText = states[stateIdx];
            }, 400);

            // Subtle interaction: mouse movement affects the background light slightly
            document.addEventListener('mousemove', (e) => {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                const logo = document.querySelector('.logo-pulse');
                logo.style.transform = `translate(${x * 10}px, ${y * 10}px)`;
            });
        });
    </script>
</body></html>
